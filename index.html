<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fair Split">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fair Split</title>
<style>
:root{
  --bg:#f3f5f0;--surface:#fff;--ink:#1c2b24;--muted:#6b7a72;--line:#dde3dc;
  --accent:#1f6f55;--accent-ink:#fff;--warn:#b4531a;--soft:#e4efe9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121a16;--surface:#1b2620;--ink:#e8efe9;--muted:#94a39a;--line:#2e3b34;
  --accent:#4fbf98;--accent-ink:#0b1a13;--warn:#e8985c;--soft:#223a2f;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.bar{display:flex;gap:4px;margin:12px 0 18px}
.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.row>.fit{flex:none}
button{font:inherit;border:0;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:transparent;color:var(--muted);padding:0 10px;font-size:1.2rem;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;background:var(--soft);border-radius:20px;padding:2px 2px 2px 14px}
.chip button{min-height:34px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.nav button{flex:1}
.nav button.ghost{flex:0 0 96px}
.item-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.badge{font-size:.8rem;padding:2px 10px;border-radius:12px;background:var(--soft);white-space:nowrap}
.badge.bad{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.cons{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.cons input{width:92px;text-align:right}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.pct{color:var(--muted);font-size:.85rem;font-weight:400}
.note{font-size:.85rem;color:var(--warn);margin:8px 0 0}
.empty{color:var(--muted);font-size:.92rem;margin:12px 0 0}
.big{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.owe{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.owe:last-child{border-bottom:0}
.owe b{font-size:1.15rem}
pre{margin:10px 0 0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  font:.78rem/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;white-space:pre;max-width:100%}
.link{background:none;color:var(--muted);text-decoration:underline;font-weight:400;min-height:36px;padding:0}
</style>
</head>
<body>
<div class="app">
  <h1>Fair Split</h1>
  <div class="bar" id="bar"></div>
  <div id="view"></div>
</div>
<div class="nav"><div>
  <button class="ghost" id="back">Back</button>
  <button id="next">Next</button>
</div></div>

<script>
const KEY = "fairsplit.v1";
const STEPS = ["People","Menu","Who ate what","Tax, tip & total","Who paid","Result"];
const blank = () => ({step:0, members:[], items:[], cons:{}, T:"", K:"", payer:""});
let S = load();

function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(blank(), JSON.parse(r)); }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,9);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmt = n => (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const getCons = (i,m) => num((S.cons[i]||{})[m]);

/* ---------- calculations ---------- */
function calc(){
  const sub = {}; S.members.forEach(m => sub[m.id] = 0);
  S.items.forEach(it => S.members.forEach(m => sub[m.id] += num(it.price) * getCons(it.id, m.id)));
  const consumed = Object.values(sub).reduce((a,b)=>a+b,0);
  const T = num(S.T), K = num(S.K), A = K - T;
  const res = S.members.map(m => {
    const share = consumed > 0 ? sub[m.id] / consumed : 0;   // share of A
    return {id:m.id, name:m.name, sub:sub[m.id], share, owes: share * (A + T)};
  });
  return {res, consumed, T, K, A};
}
function remaining(it){
  let used = 0; S.members.forEach(m => used += getCons(it.id, m.id));
  return num(it.qty) - used;
}

/* ---------- views ---------- */
function render(){
  $("bar").innerHTML = STEPS.map((_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("");
  $("back").style.display = S.step === 0 ? "none" : "";
  $("next").textContent = S.step === 5 ? "Start new bill" : (S.step === 4 ? "See result" : "Next");
  $("view").innerHTML = [vPeople,vMenu,vCons,vTotals,vPayer,vResult][S.step]();
  bind();
  save();
}

function vPeople(){
  return `<h2>Who is at the table?</h2><p class="sub">Add everyone sharing the bill.</p>
  <div class="card"><div class="row"><div><label for="nm">Name</label><input id="nm" placeholder="e.g. Asha" autocomplete="off"></div>
  <button class="fit" id="addM">Add</button></div>
  ${S.members.length ? `<div class="chips">${S.members.map(m=>`<span class="chip">${esc(m.name)}<button class="x" data-delm="${m.id}" aria-label="Remove ${esc(m.name)}">×</button></span>`).join("")}</div>`
   : `<p class="empty">No one added yet.</p>`}</div>`;
}

function vMenu(){
  return `<h2>What was ordered?</h2><p class="sub">Price per piece and total quantity ordered.</p>
  <div class="card">
    <label for="in">Item name</label><input id="in" placeholder="e.g. Paneer pizza" autocomplete="off">
    <div class="row" style="margin-top:10px">
      <div><label for="ip">Price per piece</label><input id="ip" type="number" inputmode="decimal" min="0" step="any"></div>
      <div><label for="iq">Total qty</label><input id="iq" type="number" inputmode="decimal" min="0" step="any"></div>
    </div>
    <button id="addI" style="width:100%;margin-top:12px">Add item</button>
  </div>
  ${S.items.length ? S.items.map(it=>`<div class="card"><div class="item-head"><div><b>${esc(it.name)}</b><div class="pct">${fmt(num(it.price))} × ${num(it.qty)} = ${fmt(num(it.price)*num(it.qty))}</div></div>
    <button class="x" data-deli="${it.id}" aria-label="Remove ${esc(it.name)}">×</button></div></div>`).join("")
   : `<p class="empty">No items yet.</p>`}`;
}

function vCons(){
  return `<h2>Who had what?</h2><p class="sub">Enter the quantity each person consumed. Shared items can use decimals, like 0.5.</p>
  ${S.items.map(it=>`<div class="card"><div class="item-head"><b>${esc(it.name)}</b><span class="badge" id="rem-${it.id}"></span></div>
    ${S.members.map(m=>`<div class="cons"><label for="c-${it.id}-${m.id}" style="margin:0;font-size:1rem;color:var(--ink)">${esc(m.name)}</label>
    <input id="c-${it.id}-${m.id}" data-i="${it.id}" data-m="${m.id}" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${getCons(it.id,m.id)||""}"></div>`).join("")}</div>`).join("")}
  <div class="card"><b>Amount before tax and tip</b><div id="subs" style="margin-top:6px"></div></div>`;
}

function vTotals(){
  return `<h2>Tax, tip and bill total</h2><p class="sub">Enter the tax and tip together as one number, then the final bill amount.</p>
  <div class="card">
    <label for="T">Total tax + tip (T)</label><input id="T" type="number" inputmode="decimal" min="0" step="any" value="${esc(S.T)}">
    <label for="K" style="margin-top:12px">Total bill amount (K)</label><input id="K" type="number" inputmode="decimal" min="0" step="any" value="${esc(S.K)}">
    <div class="line" style="margin-top:12px"><span>Amount before taxes (A = K − T)</span><span class="num" id="A"></span></div>
    <div class="line"><span>Sum of items consumed</span><span class="num" id="C"></span></div>
    <p class="note" id="mis" hidden></p>
  </div>`;
}

function vPayer(){
  return `<h2>Who paid the bill?</h2><p class="sub">Everyone else will owe this person.</p>
  <div class="card">${S.members.map(m=>`<div class="cons"><label style="margin:0;font-size:1rem;color:var(--ink)"><input type="radio" name="payer" value="${m.id}" ${S.payer===m.id?"checked":""} style="width:auto;min-height:0;margin-right:10px">${esc(m.name)}</label></div>`).join("")}</div>`;
}

function vResult(){
  const c = calc(), X = S.members.find(m=>m.id===S.payer);
  const others = c.res.filter(r=>r.id!==S.payer);
  return `<h2>Settle up</h2><p class="sub">Bill ${fmt(c.K)} = items ${fmt(c.A)} + tax and tip ${fmt(c.T)}</p>
  <div class="card"><b>Everyone owes ${esc(X?X.name:"the payer")}</b>
    ${others.length ? others.map(r=>`<div class="owe"><span>${esc(r.name)}</span><b class="num">${fmt(r.owes)}</b></div>`).join("") : `<p class="empty">No one else to settle with.</p>`}</div>
  <div class="card"><b>How each share was worked out</b>
    <p class="pct" style="margin:2px 0 6px">Share × (A + T)</p>
    ${c.res.map(r=>`<div class="line"><span>${esc(r.name)}<div class="pct">Items ${fmt(r.sub)} · ${fmt(r.share*100)}% of A → tax and tip ${fmt(r.share*c.T)}</div></div>
    <span class="num">${fmt(r.owes)}</span></div>`).join("")}
    <div class="line"><b>Total</b><b class="num">${fmt(c.res.reduce((a,r)=>a+r.owes,0))}</b></div></div>
  ${Math.abs(c.consumed - c.A) > 0.005 ? `<p class="note">Items consumed (${fmt(c.consumed)}) differ from A (${fmt(c.A)}). Shares are based on what each person consumed, so the totals still add up to K.</p>`:""}
  <div class="card"><b>Export summary</b>
    <pre id="prev">${esc(buildSummary())}</pre>
    <div class="row" style="margin-top:10px"><button id="copyS">Copy text</button><button class="ghost" id="shareS">Share or save</button></div>
    <p class="pct" id="expMsg" style="margin:8px 0 0" aria-live="polite"></p></div>`;
}

/* ---------- live updates ---------- */
function updateCons(){
  S.items.forEach(it=>{
    const r = remaining(it), b = $("rem-"+it.id); if(!b) return;
    b.className = "badge" + (Math.abs(r)>1e-9 ? " bad" : "");
    b.textContent = Math.abs(r)<1e-9 ? "All assigned" : (r>0 ? `${+r.toFixed(3)} left to assign` : `${+(-r).toFixed(3)} over`);
  });
  const c = calc(), el = $("subs");
  if(el) el.innerHTML = c.res.map(r=>`<div class="line"><span>${esc(r.name)}</span><span class="num">${fmt(r.sub)}</span></div>`).join("")
    + `<div class="line"><b>Total</b><b class="num">${fmt(c.consumed)}</b></div>`;
}
function updateTotals(){
  const c = calc();
  $("A").textContent = fmt(c.A); $("C").textContent = fmt(c.consumed);
  const m = $("mis"), diff = c.consumed - c.A;
  m.hidden = Math.abs(diff) < 0.005;
  m.textContent = `Items consumed differ from A by ${fmt(Math.abs(diff))}. Check your menu prices, T and K.`;
}

/* ---------- events ---------- */
function bind(){
  if(S.step===0){
    const add = () => { const v = $("nm").value.trim(); if(!v) return;
      S.members.push({id:uid(), name:v}); render(); $("nm").focus(); };
    $("addM").onclick = add; $("nm").onkeydown = e => { if(e.key==="Enter") add(); };
    document.querySelectorAll("[data-delm]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.delm; S.members=S.members.filter(m=>m.id!==id);
      Object.values(S.cons).forEach(o=>delete o[id]); if(S.payer===id) S.payer=""; render(); });
  }
  if(S.step===1){
    $("addI").onclick = () => {
      const name=$("in").value.trim(), price=$("ip").value, qty=$("iq").value;
      if(!name || price==="" || num(qty)<=0){ alert("Enter a name, a price and a quantity above 0."); return; }
      S.items.push({id:uid(), name, price:num(price), qty:num(qty)}); render(); $("in").focus(); };
    document.querySelectorAll("[data-deli]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.deli; S.items=S.items.filter(i=>i.id!==id); delete S.cons[id]; render(); });
  }
  if(S.step===2){
    document.querySelectorAll("input[data-i]").forEach(inp=>inp.oninput=()=>{
      const i=inp.dataset.i, m=inp.dataset.m; (S.cons[i]=S.cons[i]||{})[m]=inp.value; save(); updateCons(); });
    updateCons();
  }
  if(S.step===3){
    ["T","K"].forEach(k=>$(k).oninput=()=>{ S[k]=$(k).value; save(); updateTotals(); });
    updateTotals();
  }
  if(S.step===4){
    document.querySelectorAll("input[name=payer]").forEach(r=>r.onchange=()=>{ S.payer=r.value; save(); });
  }
  if(S.step===5){
    $("copyS").onclick = async () => flash(await copyText(buildSummary()) ? "Copied to clipboard." : "Copy failed. Select the text above and copy it manually.");
    $("shareS").onclick = async () => {
      const t = buildSummary();
      if(navigator.share){
        try{ await navigator.share({title:"Bill split summary", text:t}); return; }
        catch(e){ if(e && e.name==="AbortError") return; }
      }
      downloadText(t); flash("Saved as bill-split-summary.txt.");
    };
  }
}

function buildSummary(){
  const c = calc(), X = S.members.find(m=>m.id===S.payer);
  const w = Math.max(6, ...S.members.map(m=>m.name.length));
  const L = [], hr = "-".repeat(34);
  L.push("BILL SPLIT SUMMARY", new Date().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}), "");
  L.push("Paid by: " + (X ? X.name : "-"), "");
  L.push("ITEMS", hr);
  S.items.forEach(it => L.push(`${it.name}: ${fmt(num(it.price))} x ${num(it.qty)} = ${fmt(num(it.price)*num(it.qty))}`));
  L.push("", "BILL", hr);
  L.push(`Before tax and tip (A): ${fmt(c.A)}`, `Tax and tip (T):        ${fmt(c.T)}`, `Total bill (K):         ${fmt(c.K)}`, "");
  L.push("WHO HAD WHAT", hr);
  c.res.forEach(r => {
    const got = S.items.filter(it=>getCons(it.id,r.id)>0).map(it=>`${it.name} x${getCons(it.id,r.id)}`);
    L.push(`${r.name}: ${got.length ? got.join(", ") : "nothing"}`);
  });
  L.push("", "SHARE OF BILL", hr);
  c.res.forEach(r => L.push(`${r.name.padEnd(w)}  ${fmt(r.sub).padStart(9)}  ${(fmt(r.share*100)+"%").padStart(8)}  +tax/tip ${fmt(r.share*c.T).padStart(8)}  = ${fmt(r.owes).padStart(9)}`));
  L.push(`${"Total".padEnd(w)}  ${" ".repeat(9)}  ${" ".repeat(8)}  ${" ".repeat(17)}  = ${fmt(c.res.reduce((a,r)=>a+r.owes,0)).padStart(9)}`);
  L.push("", "SETTLE UP", hr);
  const others = c.res.filter(r=>r.id!==S.payer);
  if(others.length) others.forEach(r => L.push(`${r.name} owes ${X?X.name:"payer"}: ${fmt(r.owes)}`));
  else L.push("Nothing to settle.");
  return L.join("\n");
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0";
    document.body.appendChild(a); a.select(); const ok=document.execCommand("copy"); a.remove(); return ok; }catch(e){ return false; }
}
function flash(msg){ const el=$("expMsg"); if(el) el.textContent=msg; }
function downloadText(t){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));
  a.download="bill-split-summary.txt"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function valid(){
  if(S.step===0 && S.members.length<2) return "Add at least two people.";
  if(S.step===1 && S.items.length<1) return "Add at least one menu item.";
  if(S.step===2){
    const off = S.items.filter(it=>Math.abs(remaining(it))>1e-9);
    if(off.length) return `Assign the full quantity for: ${off.map(i=>i.name).join(", ")}.`;
  }
  if(S.step===3){
    if(S.T==="" || S.K==="") return "Enter both T and K.";
    if(num(S.K) < num(S.T)) return "The bill total must be at least the tax and tip.";
  }
  if(S.step===4 && !S.payer) return "Choose who paid.";
  return "";
}

$("next").onclick = () => {
  if(S.step===5){ if(confirm("Clear this bill and start over?")){ S=blank(); render(); } return; }
  const err = valid(); if(err){ alert(err); return; }
  S.step++; render(); window.scrollTo(0,0);
};
$("back").onclick = () => { if(S.step>0){ S.step--; render(); window.scrollTo(0,0); } };

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
render();
</script>
</body>
</html>
